# Maple Gateway 本地开发默认配置（值与 server/.env 对齐，本地以 .env 为准）。
# main.go 从 cwd 读 .env（godotenv）；本文件仅当显式传 -config 时参与合并，
# 故各字段值与 .env 保持一致，避免端口/凭据双头漂移。生产建议用环境变量覆盖。
# 注：MAPLE_INTERNAL_TOKEN（discovery 认证）与 seed 账号 MAPLE_ADMIN_EMAIL/PASSWORD
# 由代码直读 os.Getenv、不经本配置，仅由 .env 提供。

# 全局唯一监听 host：所有监听口（gateway http/https、management）共用此网卡。
listen:
  host: 0.0.0.0             # 0.0.0.0 全接口 / 127.0.0.1 仅回环；空等价全接口

gateway:
  http:
    port: 8091              # 数据平面端口（开发 e2e：数据面 8091 / 管理面 8090）
  https:
    enabled: true           # 开发验证启用 HTTPS（需同时提供 cert/key）
    port: 8093              # 数据面 HTTPS
    cert: certs/test-cert.pem
    key: certs/test-key.pem

management:
  port: 8090                # 管理面 API 端口

health:
  interval: 10s
  timeout: 3s
  failure_threshold: 3
  success_threshold: 2
  grace_period: 10s

proxy:
  read_header_timeout: 10s
  response_header_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576        # 1MB
  max_body_bytes: 10485760         # 10MB

database:
  driver: postgres
  url: "postgres://maple:maple@localhost:5432/maple?sslmode=disable"

redis:
  enabled: true
  url: "redis://localhost:6379"
  prefix: maple                # 业务 key 命名空间前缀（与 .env MAPLE_REDIS_PREFIX 对齐）

logging:
  level: info
  pretty: true

security:
  admin_token: dev-admin-token       # 与 .env MAPLE_ADMIN_TOKEN 对齐；加载时 .env 仍会覆盖本值
  trusted_proxies: []                # 如 ["127.0.0.1", "::1"]
  instance_allow_private: true       # Instance 地址默认允许内网段

# Phase 5 Direct TLS：证书存储加密密钥（base64 32 字节，AES-256-GCM）。
# 配此项或环境变量 MAPLE_TLS_CERT_ENC_KEY；不配则证书管理 API（/api/admin/certificates）不注册。
# 生成：openssl rand -base64 32。存量证书换 key 会解不开旧私钥，需保持同一把。
tls:
  mode: direct                       # direct（按 SNI 动态选每域名证书）/ global（单全局证书）。direct 需 DB + 证书服务
  cert_enc_key: "u+IBv5z9z+RqwIbEV9WPfedoJLm/gj0MwM6QmF1+MYs="

# Managed Certificate / ACME 自动签发续期。
# 本地开发默认关闭：签发需域名可被公网 CA 访问（http-01 走 80 端口），本地无法联调真实 CA。
# 开启需同时配置 tls.cert_enc_key（账户密钥/证书私钥均加密落库，不可降级为明文）。
acme:
  enabled: true                      # 自动签发/续期总开关；关闭时仅支持手动上传证书
  directory_url: https://acme-staging-v02.api.letsencrypt.org/directory
                                     # 本地开发用 staging（无速率限制）；生产改 https://acme-v02.api.letsencrypt.org/directory
  email: "admin@maple.com"                          # 账户注册邮箱（开启后首次装载必填）
  challenge: http-01                 # http-01（网关代答 /.well-known/acme-challenge/）
  key_type: ec256                    # ec256 / rsa2048
  renew_before: 720h                 # 提前续期窗口（30 天）
  renew_check_interval: 1h           # 续期扫描节奏
  max_renew_attempts: 5              # 连续失败上限，超过转告警并停止自动重试
  rate_limit_backoff: 6h             # 触发 CA 限流后的最小重试间隔
