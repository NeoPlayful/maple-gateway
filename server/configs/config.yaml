# Maple Gateway 本地开发默认配置（值与 server/.env 对齐，本地以 .env 为准）。
# main.go 从 cwd 读 .env（godotenv）；本文件仅当显式传 -config 时参与合并，
# 故各字段值与 .env 保持一致，避免端口/凭据双头漂移。生产建议用环境变量覆盖。
# 注：MAPLE_INTERNAL_TOKEN（discovery 认证）与 seed 账号 MAPLE_ADMIN_EMAIL/PASSWORD
# 由代码直读 os.Getenv、不经本配置，仅由 .env 提供。

gateway:
  http:
    address: ":8091"        # 数据平面地址（开发 e2e：数据面 8091 / 管理面 8090）
  https:
    enabled: true           # 开发验证启用 HTTPS（需同时提供 cert/key）
    address: ":8093"        # 数据面 HTTPS
    cert: certs/test-cert.pem
    key: certs/test-key.pem

management:
  address: ":8090"          # 管理面 API 地址

health:
  interval: 10s
  timeout: 3s
  failure_threshold: 3
  success_threshold: 2
  grace_period: 10s

proxy:
  read_header_timeout: 10s
  response_header_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576        # 1MB
  max_body_bytes: 10485760         # 10MB

database:
  driver: postgres
  url: "postgres://maple:maple@localhost:5432/maple?sslmode=disable"

redis:
  enabled: true
  url: "redis://localhost:6379"
  prefix: maple                # 业务 key 命名空间前缀（与 .env MAPLE_REDIS_PREFIX 对齐）

logging:
  level: info
  pretty: true

security:
  admin_token: dev-admin-token       # 与 .env MAPLE_ADMIN_TOKEN 对齐；加载时 .env 仍会覆盖本值
  trusted_proxies: []                # 如 ["127.0.0.1", "::1"]
  instance_allow_private: true       # Instance 地址默认允许内网段

# Phase 5 Direct TLS：证书存储加密密钥（base64 32 字节，AES-256-GCM）。
# 配此项或环境变量 MAPLE_TLS_CERT_ENC_KEY；不配则证书管理 API（/api/admin/certificates）不注册。
# 生成：openssl rand -base64 32。存量证书换 key 会解不开旧私钥，需保持同一把。
tls:
  cert_enc_key: "u+IBv5z9z+RqwIbEV9WPfedoJLm/gj0MwM6QmF1+MYs="
