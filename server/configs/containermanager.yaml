# Container Manager 进程配置（开发默认值）。
# 仅当显式 `-config` 传入时参与合并；环境变量 MAPLE_CM_* 可覆盖。
# 与 Gateway 同仓库、同 Go module，但作为独立进程与独立部署单元运行。

cm:
  listen: ":9091"                 # CM 对外监听（接收 Gateway 部署意图 / 状态查询）
  token: "dev-cm-token"           # 校验 Gateway 访问本进程的令牌（MAPLE_CM_TOKEN）
  agent_listen: ":9093"           # 接收 Agent 主动连接的 WebSocket 监听地址（/agent/ws）
  gateway_base_url: "http://localhost:8090"  # 状态上行目标（Gateway 内部 API 基址）
  gateway_token: "dev-internal-token"  # 上报 Gateway 令牌（= Gateway 的 MAPLE_INTERNAL_TOKEN）
  # 节点/令牌/任务/期望态持久化（与 Gateway 同库）。空则退化为内存，重启即失忆。
  database_url: "postgres://maple:maple@localhost:5432/maple?sslmode=disable"
  enrollment_required: false      # 开发环境放开一次性注册令牌；生产应置 true
  reconcile_interval: 5s          # 期望态对账周期
  observe_interval: 10s           # 采集节点容器/资源状态周期
  task_timeout: 5m                # 单条下发任务的执行时限
  default_replicas: 1             # 期望态缺省副本数
  # 静态登记的节点清单：仅提供节点名与调度属性。节点身份（UUID）在 Agent 首次连接时
  # 经由 Gateway 的 /api/internal/nodes/register 按名幂等解析，无需在此配 Agent 地址。
  # name 必须与对应 Agent 的 node_name 一致。
  nodes:
    - name: node-local            # 本地开发节点（与 nodeagent node_name 一致）
      host: 127.0.0.1             # 节点地址（上报 Gateway 供展示）
      region: local

logging:
  level: info
  pretty: true
