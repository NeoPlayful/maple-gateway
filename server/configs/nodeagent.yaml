# Node Agent 进程配置（开发默认值）。
# 仅当显式 `-config` 传入时参与合并；环境变量 MAPLE_AGENT_* 可覆盖。
# Agent 运行在每台 Node 上，是唯一直连本机 Docker Engine 的组件。

agent:
  # Agent 主动连接 CM：命令经这条持久 WebSocket 下行。配置后 Agent 主动连 CM，
  # 节点无需对外暴露任何入站管理端口。路径固定为 /agent/ws。
  server_url: "ws://127.0.0.1:9093/agent/ws"
  # 不监听面向 CM 的 HTTP 管理端口。置 true 后节点仅经 WebSocket 连接被访问。
  disable_http: true
  # 凭证落盘路径：首注册成功后 CM 下发的 node_id + secret 存放于此，重启免重注册。
  credential_path: "configs/nodeagent-credential.json"
  # 一次性注册令牌（仅需强制注册时填写）：留空即让 CM 作为新节点登记。
  enrollment_token: ""
  # Docker Engine 端点。空则用 SDK 平台默认：
  #   Linux（含容器内挂载 docker.sock）: unix:///var/run/docker.sock
  #   Windows（Docker Desktop）        : npipe:////./pipe/docker_engine
  docker_host: ""
  allowed_images: []              # 镜像允许清单（前缀匹配，空则不限）
  managed_label: "maple.managed"  # 受管容器标签键：Agent 只操作带此标签的容器
  node_name: "node-local"         # 本节点标识（连接时作为节点名，须与 CM static nodes 一致）

logging:
  level: info
  pretty: true
