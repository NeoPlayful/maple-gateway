# Maple Gateway 配置示例。复制为 config.yaml 或全部通过环境变量覆盖。

# 全局唯一监听 host：所有监听口（gateway http/https、management）共用此网卡。
listen:
  host: 0.0.0.0             # 0.0.0.0 全接口 / 127.0.0.1 仅回环；空等价全接口

gateway:
  http:
    port: 9091              # e2e HTTP
  https:
    enabled: true            # e2e HTTPS 验证
    port: 9093              # e2e HTTPS
    cert: certs/test-cert.pem
    key: certs/test-key.pem

management:
  port: 9090                # e2e management

health:
  interval: 10s
  timeout: 3s
  failure_threshold: 3
  success_threshold: 2
  grace_period: 10s

proxy:
  read_header_timeout: 10s
  response_header_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576
  max_body_bytes: 10485760

database:
  driver: postgres
  url: ""                                  # e2e：清空以强制静态路由模式（不连 DB）

redis:
  enabled: false
  url: "redis://localhost:6379"
  prefix: maple                # 业务 key 命名空间前缀（空默认 maple）

logging:
  level: info
  pretty: true

security:
  admin_token: ""                    # 建议用 MAPLE_ADMIN_TOKEN 注入
  trusted_proxies: []                # 如 ["127.0.0.1", "::1"]
  instance_allow_private: true

# ---- Phase 4 ----
ha:
  enabled: false                     # 多实例 HA：注册 gateway_instances + Leader 竞逐（Redis 锁优先，DB lease 兜底）
  instance_id: ""                    # 唯一实例 ID；空则启动自动生成
  heartbeat: 5s
  lease_ttl: 15s

ratelimit:
  mode: memory                       # memory（单机）/ redis（跨实例共享配额）

canary_auto:
  enabled: false                     # 自动 Canary：指标驱动自动推进/回滚
  interval: 15s
  err_rate_max: 5                    # canary 错误率上限（%），超限止损 SetWeight(0)+Pause
  err_latency_ms: 0                  # 平均延迟上限（ms），>0 才启用
  min_requests: 10                   # 窗口最小请求数，不足不推进

trace:
  enabled: false                     # OTel 数据面追踪（stdout 导出）
  sample_ratio: 0.01                 # 采样率 0-1

# ---- Phase 5：Direct TLS（e2e）----
tls:
  mode: global                       # global / direct；direct 需 DB（MAPLE_DATABASE_URL）+ MAPLE_CERT_ENC_KEY
  min_version: tls1.2
  enforce_sni_host_match: true
  fallback_cert_enabled: false       # e2e：验证未知 SNI 拒绝握手路径（隔离优先）
