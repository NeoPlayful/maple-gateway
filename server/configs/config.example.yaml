# Maple Gateway 配置示例。复制为 config.yaml 或全部通过环境变量覆盖。

gateway:
  http:
    address: ":80"          # 数据平面 HTTP（Docker 生产），开发常用 :8000
  https:
    enabled: false          # Phase 2 起按需启用；enabled 时需同时提供 cert/key
    address: ":443"         # 数据平面 HTTPS
    cert: /etc/maple-gateway/tls.crt
    key: /etc/maple-gateway/tls.key

management:
  address: ":4000"          # 控制面 API

health:
  interval: 10s
  timeout: 3s
  failure_threshold: 3
  success_threshold: 2
  grace_period: 10s

proxy:
  read_header_timeout: 10s
  response_header_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576
  max_body_bytes: 10485760

database:
  driver: postgres
  url: "postgres://maple:maple@localhost:5432/maple?sslmode=disable"

redis:
  enabled: false
  url: "redis://localhost:6379/0"

logging:
  level: info
  pretty: true

security:
  admin_token: ""                    # 建议用 MAPLE_ADMIN_TOKEN 注入
  trusted_proxies: []                # 如 ["127.0.0.1", "::1"]
  instance_allow_private: true

# ---- Phase 4 ----
ha:
  enabled: false                     # 多实例 HA：注册 gateway_instances + Leader 竞逐（Redis 锁优先，DB lease 兜底）
  instance_id: ""                    # 唯一实例 ID；空则启动自动生成
  heartbeat: 5s
  lease_ttl: 15s

ratelimit:
  mode: memory                       # memory（单机）/ redis（跨实例共享配额）

canary_auto:
  enabled: false                     # 自动 Canary：指标驱动自动推进/回滚
  interval: 15s
  err_rate_max: 5                    # canary 错误率上限（%），超限止损 SetWeight(0)+Pause
  err_latency_ms: 0                  # 平均延迟上限（ms），>0 才启用
  min_requests: 10                   # 窗口最小请求数，不足不推进

trace:
  enabled: false                     # OTel 数据面追踪（stdout 导出）
  sample_ratio: 0.01                 # 采样率 0-1
