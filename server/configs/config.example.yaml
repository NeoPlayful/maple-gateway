# Maple Gateway 配置示例。复制为 config.yaml 或全部通过环境变量覆盖。

gateway:
  http:
    address: ":80"          # 数据平面 HTTP（Docker 生产），开发常用 :8000
  https:
    enabled: false          # Phase 2 起按需启用；enabled 时需同时提供 cert/key
    address: ":443"         # 数据平面 HTTPS
    cert: /etc/maple-gateway/tls.crt
    key: /etc/maple-gateway/tls.key

management:
  address: ":4000"          # 控制面 API

health:
  interval: 10s
  timeout: 3s
  failure_threshold: 3
  success_threshold: 2
  grace_period: 10s

proxy:
  read_header_timeout: 10s
  response_header_timeout: 60s
  idle_timeout: 120s
  max_header_bytes: 1048576
  max_body_bytes: 10485760

database:
  driver: postgres
  url: "postgres://maple:maple@localhost:5432/maple?sslmode=disable"

redis:
  enabled: false
  url: "redis://localhost:6379"
  prefix: maple                # 业务 key 命名空间前缀（空默认 maple）

logging:
  level: info
  pretty: true

security:
  admin_token: ""                    # 建议用 MAPLE_ADMIN_TOKEN 注入
  trusted_proxies: []                # 如 ["127.0.0.1", "::1"]
  instance_allow_private: true

# ---- Phase 4 ----
ha:
  enabled: false                     # 多实例 HA：注册 gateway_instances + Leader 竞逐（Redis 锁优先，DB lease 兜底）
  instance_id: ""                    # 唯一实例 ID；空则启动自动生成
  heartbeat: 5s
  lease_ttl: 15s

ratelimit:
  mode: memory                       # memory（单机）/ redis（跨实例共享配额）

canary_auto:
  enabled: false                     # 自动 Canary：指标驱动自动推进/回滚
  interval: 15s
  err_rate_max: 5                    # canary 错误率上限（%），超限止损 SetWeight(0)+Pause
  err_latency_ms: 0                  # 平均延迟上限（ms），>0 才启用
  min_requests: 10                   # 窗口最小请求数，不足不推进

trace:
  enabled: false                     # OTel 数据面追踪（stdout 导出）
  sample_ratio: 0.01                 # 采样率 0-1

# ---- Phase 5：Direct TLS ----
tls:
  mode: global                       # global（单全局证书，Phase 4 兼容）/ direct（按 SNI 动态选每域名证书）
  min_version: tls1.2                # tls1.2 / tls1.3
  enforce_sni_host_match: true       # direct 模式：SNI 与 Host 不一致返回 421 Misdirected Request
  fallback_cert_enabled: false       # direct 模式：未知 SNI/无 SNI 默认拒绝握手（隔离优先）；需内网泛兜底时改 true
  # 证书私钥存储加密密钥（base64 32 字节，AES-256-GCM）。上传的私钥落库前加密，密钥必须独立于数据库。
  # 生成：openssl rand -base64 32。配这里或环境变量 MAPLE_TLS_CERT_ENC_KEY；不配则证书管理 API 不注册。
  # 存量证书换 key 会解不开旧私钥，需保持同一把。下方为开发用固定密钥（本地直用），生产必须更换。
  cert_enc_key: "u+IBv5z9z+RqwIbEV9WPfedoJLm/gj0MwM6QmF1+MYs="
