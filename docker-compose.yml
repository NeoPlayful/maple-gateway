# Maple Gateway 开发 / 测试编排。
# maple-gateway 服务依赖 postgres；redis 同栈运行，供本地/数据面使用。
# 控制面由 containermanager(CM) 与 nodeagent 组成：CM 编排、Agent 直连 Docker。
# 测试容器 shop-* 仅用于开发验证，模拟真实租户实例（生产由 Container Manager 管理）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: maple
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: maple
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  maple-gateway:
    build: ./server
    image: maple-gateway:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAPLE_DATABASE_URL: postgres://maple:maple@postgres:5432/maple?sslmode=disable
      MAPLE_ADMIN_TOKEN: dev-admin-token
      MAPLE_INTERNAL_TOKEN: dev-internal-token
      MAPLE_LISTEN_HOST: 0.0.0.0
      MAPLE_GATEWAY_HTTP_PORT: "80"
      MAPLE_GATEWAY_HTTPS_PORT: "443"
      MAPLE_MANAGEMENT_PORT: "8090"
    ports:
      - "80:80"          # 数据平面 HTTP
      - "443:443"        # 数据平面 HTTPS
      - "8090:8090"      # Management API
    restart: unless-stopped

  # ---- 控制面：Container Manager（编排，不碰 Docker） ----
  containermanager:
    image: maple-gateway:dev
    entrypoint: ["maple-cm"]
    depends_on:
      - maple-gateway
    environment:
      MAPLE_CM_LISTEN: ":9091"                                  # 供 Gateway 下发部署意图
      MAPLE_CM_TOKEN: dev-cm-token                              # 校验 Gateway 访问
      MAPLE_CM_GATEWAY_BASE_URL: http://maple-gateway:8090      # 状态上报目标
      MAPLE_CM_GATEWAY_TOKEN: dev-internal-token                # = Gateway MAPLE_INTERNAL_TOKEN
      MAPLE_CM_DATABASE_URL: postgres://maple:maple@postgres:5432/maple?sslmode=disable
      MAPLE_CM_AGENT_LISTEN: ":9093"                            # 接收 Agent 反连（WebSocket）
      MAPLE_CM_RECONCILE_INTERVAL: 5s
      MAPLE_CM_OBSERVE_INTERVAL: 10s
    ports:
      - "9091:9091"       # 面向 Gateway
      - "9093:9093"       # 面向 Agent 的反连接入
    restart: unless-stopped

  # ---- 控制面：Node Agent（唯一直连本机 Docker Engine 的组件） ----
  nodeagent:
    image: maple-gateway:dev
    entrypoint: ["maple-nodeagent"]
    depends_on:
      - containermanager
    environment:
      MAPLE_AGENT_SERVER_URL: "ws://containermanager:9093/agent/ws"   # 主动反连 CM
      MAPLE_AGENT_DISABLE_HTTP: "true"          # 不暴露入站管理端口，命令全部经 WS 下行
      MAPLE_AGENT_DOCKER_HOST: ""               # 空则用挂载的 docker.sock
      MAPLE_AGENT_MANAGED_LABEL: maple.managed  # 仅操作带此标签的容器
      MAPLE_AGENT_NODE_NAME: node-local         # 本节点标识
      MAPLE_AGENT_CREDENTIAL_PATH: /var/lib/maple-agent/credential.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # Agent 直接驱动本机 Docker Engine
      - nodeagent-cred:/var/lib/maple-agent         # 持久化注册凭证，重启免重注册
    restart: unless-stopped

  # ---- 开发测试容器（模拟租户实例，供数据平面转发验证） ----
  shop-a:
    image: nginx:alpine
    profiles: ["test"]
  shop-b:
    image: nginx:alpine
    profiles: ["test"]

volumes:
  postgres-data:
  nodeagent-cred:
