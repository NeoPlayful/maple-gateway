# Maple Gateway 开发 / 测试编排。
# maple-gateway 服务依赖 postgres；redis 同栈运行，供本地/数据面使用。
# 测试容器 shop-* 仅用于开发验证，模拟真实租户实例（生产由 Container Manager 管理）。

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: maple
      POSTGRES_USER: maple
      POSTGRES_PASSWORD: maple
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maple -d maple"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  maple-gateway:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAPLE_DATABASE_URL: postgres://maple:maple@postgres:5432/maple?sslmode=disable
      MAPLE_ADMIN_TOKEN: dev-admin-token
      MAPLE_LISTEN_HOST: 0.0.0.0
      MAPLE_GATEWAY_HTTP_PORT: "80"
      MAPLE_GATEWAY_HTTPS_PORT: "443"
      MAPLE_MANAGEMENT_PORT: "8090"
    ports:
      - "80:80"          # 数据平面 HTTP
      - "443:443"        # 数据平面 HTTPS
      - "8090:8090"      # Management API
    restart: unless-stopped

  # ---- 开发测试容器（模拟租户实例，供数据平面转发验证） ----
  shop-a:
    image: nginx:alpine
    profiles: ["test"]
  shop-b:
    image: nginx:alpine
    profiles: ["test"]

volumes:
  postgres-data:
